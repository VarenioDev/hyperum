<html lang="en">

  <meta property="og:type" content="website" />

    content="Учитель жмёт одну кнопку — каждый ученик получает свой тест в зоне ближайшего развития. Попробуй демо без регистрации."
  />
  <meta property="og:image" content="https://hyperum.polyum.ru/og-image.png" />

    name="twitter:description"
