services:
  postgres:
    image: postgres:16
    container_name: hyperum_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hyperum
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: hyperum_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - hyperum

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hyperum_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Переопределяем URL для Docker-сети
      HYPERUM_DB_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HYPERUM_NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    ports:
      # Слушаем только localhost — доступ через Nginx снаружи
      - "127.0.0.1:8000:8000"
    networks:
      - hyperum

networks:
  hyperum:

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
